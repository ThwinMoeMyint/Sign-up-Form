<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
</head>
<link rel="stylesheet" href="style.css">
<body>
        <div class="side">
            <div class="logo">
                <a href="index.html">Big Logo</a>
            </div>
        </div>
        <div class="sign-up">
            <div class="paragraph">
                <p>
                    This the Sign-up form for your online course <br>
                    Sign it up and enjoy your full experience <br>
                    Start now!!
                </p>
    
                <span>I know you want to</span>
            </div>
                <form action="#" class="form">
                    <div style="font-size: 20px; padding-bottom: 5px;">Sign-up Now!!!</div>
                    <div class="user-input">
                        <div class="input-boxes">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name">
                        </div>
                        <div class="input-boxes">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name">
                        </div> 
                    </div>
                    <div class="user-input">
                        <div class="input-boxes">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="input-boxes">
                            <label for="phone-number">Phone Number</label>
                            <input type="number" id="phone-number" name="phone-number">
                        </div>  
                    </div>
                    <div class="user-input">
                        <div class="input-boxes">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div class="input-boxes">
                            <label for="password">Confirm Password</label>
                            <input type="password" name="password" id="password">
                        </div>
                    </div>
                </form>
                <div class="footer">
                    <button class="create-account">Create Account</button>
                    <span>Already have Account? <a href="index.html">Login</a></span>
                </div>
        </div>
</body>
</html>
